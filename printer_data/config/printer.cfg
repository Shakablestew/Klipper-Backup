[include shell_command.cfg]
[include mainsail.cfg]
[include KAMP_Settings.cfg]
[include timelapse.cfg]
[include gcode-macros.cfg]
[exclude_object]

[force_move]
enable_force_move: True

[mcu]
canbus_uuid: d9a0fea82a6e

[mcu Ebb36]
canbus_uuid: 60c2a5d0afe2

[firmware_retraction]
retract_length: 1.75
retract_speed: 50
unretract_extra_length: 0
unretract_speed: 45

[printer]
kinematics: corexy
max_velocity: 150  
max_accel: 4000   
#max_accel_to_decel: 2000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

## Rear_Left, MOTOR_6, DIAG_6
[stepper_x]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200  
endstop_pin: Ebb36:PB8 #tmc2240_stepper_x:virtual_endstop
position_min: 0
position_endstop: 324
position_max: 324
homing_speed: 50 #20   
homing_retract_dist: 0
homing_positive_dir: True

[tmc2240 stepper_x]
cs_pin: PE1
spi_speed: 500000
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
interpolate: False
run_current: 1
rref: 12000
stealthchop_threshold: 99999
#diag0_pin: ^!PG14
#driver_SGT: 3     # -64 most sensitive - 63 least sensitive

##REAR_RIGHT, MOTOR_1, DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200  
endstop_pin: PG10 #tmc2240_stepper_y:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 50 #20  
homing_retract_dist: 0
#homing_positive_dir: True

[tmc2240 stepper_y]
cs_pin: PD11
spi_speed: 500000
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
interpolate: False
run_current: 1
rref: 12000
stealthchop_threshold: 99999
#diag0_pin: ^!PG9
#driver_SGT: 4

## FRONT_LEFT, MOTOR_2, DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 4    
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 245
position_min: -2.5
homing_speed: 8.0 
second_homing_speed: 3
homing_retract_dist: 0

[tmc2240 stepper_z]
cs_pin: PC6
spi_speed: 500000
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
interpolate: False
run_current: 0.75
rref: 12000
stealthchop_threshold: 99999

## REAR_CENTER, MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
rotation_distance: 4  
microsteps: 32

[tmc2240 stepper_z1]
cs_pin: PC7
spi_speed: 500000
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
interpolate: False
run_current: 0.75
rref: 12000
stealthchop_threshold: 99999

## FRONT_RIGHT, MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 4  
microsteps: 32

[tmc2240 stepper_z2]
cs_pin: PF2
spi_speed: 500000
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
interpolate: False
run_current: 0.75
rref: 12000
stealthchop_threshold: 99999

[extruder]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 21.75
gear_ratio: 50:10
microsteps: 32
full_steps_per_rotation: 200
nozzle_diameter: 0.600
filament_diameter: 1.75
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: Ebb36:PA3
heater_pin: Ebb36:PB13
min_temp: 10
max_temp: 330
max_power: 1.0
min_extrude_temp: 225
max_extrude_only_distance: 150
max_extrude_cross_section: 10
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040

[tmc2240 extruder]
cs_pin: PE4
spi_speed: 500000
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
interpolate: False
run_current: 0.6
rref: 12000
stealthchop_threshold: 99999
driver_IHOLDDELAY: 8
driver_IRUNDELAY: 2
driver_TBL: 3
driver_TOFF: 4
driver_HEND: 3
driver_HSTRT: 4
driver_TPFD: 0
driver_PWM_AUTOSCALE: True
driver_PWM_AUTOGRAD: True
driver_PWM_GRAD: 12
driver_PWM_OFS: 40
driver_PWM_REG: 15
driver_PWM_LIM: 12
driver_SGT: 30
driver_SEMIN: 2
driver_SEMAX: 8
diag0_pin: PG13

[heater_bed]
heater_pin: PB11
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 1
min_temp: 0
max_temp: 135
pwm_cycle_time: 0.01666

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_F63C22EE4E5737374D202020FF080714-if00
x_offset: 0 # update with offset from nozzle on your machine
y_offset: -22.5 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2

#[fan]
#pin: Ebb36:PA1

[heater_fan Hotend_Fan]
pin: Ebb36:PA0
max_power: 1.0
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[heater_fan Bed_Fan]
pin: PD12
max_power: 1
heater: heater_bed
heater_temp: 50
fan_speed: 1.0

[temperature_sensor Octopus]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 10 
max_temp: 125

[temperature_sensor Ebb36]
sensor_type: temperature_mcu      
sensor_mcu: Ebb36
min_temp: 10 
max_temp: 125

[temperature_sensor Pi_4B]
sensor_type: temperature_host
min_temp: 10 
max_temp: 125

[temperature_sensor Chamber]
sensor_type: temperature_combined
sensor_list: temperature_sensor upper_chamber, temperature_sensor lower_chamber
combination_method: mean
maximum_deviation: 999.9

[temperature_sensor upper_chamber]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF4
min_temp: 0
max_temp: 150

[temperature_sensor lower_chamber]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF5
min_temp: 0
max_temp: 150                   

[heater_generic chamber_heater]  
heater_pin: PB10                  
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF6                  
control: watermark               
max_delta: 0.1                   
max_power: 0.55                   
min_temp: -100                   
max_temp: 100                     
pwm_cycle_time: 0.01666          #Set this to avoid room lights flickering on higher power heaters. This value works well for 60Hz power. 0.1 is 10Hz

[verify_heater chamber_heater]   #setup chamber heater verification parameters
max_error: 120
check_gain_time: 240
hysteresis: 5
heating_gain: 1

[heater_fan heater_fan]         
pin: PE5                        
max_power: 1.0                  
heater: chamber_heater          
heater_temp: 30                 

[input_shaper]
shaper_type_x: ei
shaper_freq_x: 64.4
shaper_type_y: ei
shaper_freq_y: 71.4

[resonance_tester]
accel_chip: beacon
probe_points: 162, 175, 25

[idle_timeout]
timeout: 7200 # timeout in seconds (1800 = 30 minutes)

[bed_mesh]
speed: 200
horizontal_move_z: 5
mesh_min: 50, 10
mesh_max: 250,275
fade_start: 0.6
fade_end: 10.0
probe_count: 5,5 # Values should be odd, so one point is directly at bed center
algorithm: bicubic

[safe_z_home]
home_xy_position: 162, 175
speed: 50.0
z_hop: 5
z_hop_speed: 15.0
move_to_previous: False

[z_tilt]
z_positions:
   -50, 18
   162, 398
   400, 18
points:
   25, 10
   162, 290
   310, 10
speed: 200
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.0075

[beacon model default]

